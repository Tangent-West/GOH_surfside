    *{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Montserrat,Arial,sans-serif;line-height:1.6}a{color:inherit;text-underline-offset:4px}.wrap{width:min(var(--wrap),calc(100% - 80px));margin:auto}.review{padding:10px 24px;background:#ece8e1;color:#59534b;font-size:10px;font-weight:700;letter-spacing:.08em;text-align:center;text-transform:uppercase}.header{display:flex;align-items:center;justify-content:space-between;padding:24px 0;border-bottom:1px solid var(--line)}.header strong{font-size:18px}.header a{font-size:12px;font-weight:700}.hero{padding:70px 0 48px;background:var(--paper)}.kicker{font-size:10px;font-weight:700;letter-spacing:.13em}.hero h1{max-width:900px;margin:13px 0 20px;font-size:clamp(42px,6vw,72px);font-weight:300;letter-spacing:-.05em;line-height:1}.hero p{max-width:830px;color:var(--muted)}main section{padding:60px 0}.comparison-table-wrap{overflow-x:auto;border:1px solid var(--line)}table{width:100%;min-width:980px;border-collapse:collapse;font-size:11px}th,td{padding:14px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}th:first-child,td:first-child{position:sticky;left:0;z-index:1;min-width:280px;background:#fff;text-align:left}thead th{background:var(--paper);font-size:10px}thead th:first-child{z-index:2;background:var(--paper)}.mark{font-size:19px;font-weight:700}.blank{color:#aaa29a}.note{max-width:980px;margin-top:25px;color:var(--muted);font-size:11px}.mobile{display:none}.status{padding:30px;border:1px solid var(--line);background:var(--paper)}@media(max-width:850px){.wrap{width:calc(100% - 38px)}.comparison-table-wrap{display:none}.mobile{display:block}.mobile label{display:block;margin-bottom:18px;font-size:11px;font-weight:700}.mobile select{width:100%;margin-top:7px;padding:12px;border:1px solid var(--line);background:#fff}.mobile table{min-width:0}.mobile th:first-child,.mobile td:first-child{position:static;min-width:0}.header{gap:18px}.header s
